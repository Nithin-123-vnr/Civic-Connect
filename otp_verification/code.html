  </head><body class="bg-surface font-body-md text-on-surface"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-margin-mobile flex items-center justify-between gap-4"><div class="flex items-center gap-4"><button class="w-touch-target-min h-touch-target-min flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><div class="flex items-center gap-2"><img alt="CivicConnect logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1VGVRu8vrSgvVkzVpdswbSQLQd5pBe6-bnCOrBxIaJfolrlnPMXvfH2jUDudDjwZwCI7C3rv5U_ccj10vb4KZi2q2u1RGoGZbvh6otN2MjZsXtHYfwnsninrsI8jF1MZQM9vcUUkPHMjx72zYG5mPwK65r_pbG6vbZRFX1DA2HF-0VGLjHA1kK83EZxAXJXYR9gewBezkeX7Tl_8YXvr4KpyiPPwsx-_SAs_WYajAHH2aDfF2q_-_YEZPLT"/><span class="font-headline-md text-headline-md text-on-surface truncate">Phone Verification</span></div></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full pt-16 bg-surface"><div class="flex flex-col w-full h-full relative px-margin-mobile pb-safe">
<!-- Header Area -->
<div class="flex flex-col items-center mt-8 mb-10 text-center">
<div class="w-16 h-16 bg-primary-fixed rounded-full flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-on-primary-fixed text-headline-xl">mark_email_unread</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Verify Your Number</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
      Enter the 6-digit code sent to <br/><span class="font-label-md text-on-surface">+91 9XXXX XXXXX</span>
</p>
</div>
<!-- OTP Input Form -->
<div class="w-full flex flex-col gap-6" id="otp-form-container">
<div class="flex justify-between w-full max-w-[340px] mx-auto gap-2">
<!-- 6 Inputs -->
<input class="w-12 h-14 rounded-lg bg-surface border border-outline-variant text-center font-headline-md text-on-surface focus:outline-none focus:border-primary focus:border-2 transition-all otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="tel"/>
<input class="w-12 h-14 rounded-lg bg-surface border border-outline-variant text-center font-headline-md text-on-surface focus:outline-none focus:border-primary focus:border-2 transition-all otp-input" disabled="" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="tel"/>
<input class="w-12 h-14 rounded-lg bg-surface border border-outline-variant text-center font-headline-md text-on-surface focus:outline-none focus:border-primary focus:border-2 transition-all otp-input" disabled="" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="tel"/>
<input class="w-12 h-14 rounded-lg bg-surface border border-outline-variant text-center font-headline-md text-on-surface focus:outline-none focus:border-primary focus:border-2 transition-all otp-input" disabled="" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="tel"/>
<input class="w-12 h-14 rounded-lg bg-surface border border-outline-variant text-center font-headline-md text-on-surface focus:outline-none focus:border-primary focus:border-2 transition-all otp-input" disabled="" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="tel"/>
<input class="w-12 h-14 rounded-lg bg-surface border border-outline-variant text-center font-headline-md text-on-surface focus:outline-none focus:border-primary focus:border-2 transition-all otp-input" disabled="" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="tel"/>
</div>
<!-- Timer and Resend -->
<div class="flex justify-center items-center gap-1 mt-2">
<span class="font-body-md text-body-md text-on-surface-variant">Didn't receive code?</span>
<button class="font-label-md text-label-md text-on-surface-variant opacity-50 cursor-not-allowed transition-colors bg-transparent border-none p-0 h-auto" disabled="" id="resend-btn">
        Resend OTP <span id="timer-text">(00:59)</span>
</button>
</div>
<!-- Spacer to push buttons to bottom if needed on taller screens, but here we keep it tight -->
<div class="flex-grow"></div>
<!-- Actions -->
<div class="mt-8 flex flex-col gap-4">
<button class="w-full h-touch-target-min bg-primary text-on-primary font-label-md text-label-md rounded-lg flex items-center justify-center transition-all opacity-50 pointer-events-none" id="verify-btn">
        Verify & Proceed
      </button>
<button class="w-full h-touch-target-min bg-transparent border border-secondary text-secondary font-label-md text-label-md rounded-lg flex items-center justify-center transition-all">
        Change Mobile Number
      </button>
</div>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const inputs = document.querySelectorAll('.otp-input');
    const verifyBtn = document.getElementById('verify-btn');
    const resendBtn = document.getElementById('resend-btn');
    const timerText = document.getElementById('timer-text');
    
    // OTP Input Logic
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1) {
          if (index < inputs.length - 1) {
            inputs[index + 1].disabled = false;
            inputs[index + 1].focus();
          }
        }
        checkVerifyState();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && e.target.value === '') {
          if (index > 0) {
            inputs[index - 1].focus();
            inputs[index - 1].value = '';
          }
        }
        checkVerifyState();
      });
      
      // Auto focus first input
      if(index === 0) {
          setTimeout(() => input.focus(), 300);
      }
    });

    function checkVerifyState() {
      const isComplete = Array.from(inputs).every(input => input.value.length === 1);
      if (isComplete) {
        verifyBtn.classList.remove('opacity-50', 'pointer-events-none');
        verifyBtn.classList.add('shadow-md');
      } else {
        verifyBtn.classList.add('opacity-50', 'pointer-events-none');
        verifyBtn.classList.remove('shadow-md');
      }
    }

    // Timer Logic
    let timeLeft = 59;
    const timerInterval = setInterval(() => {
      timeLeft--;
      const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
      timerText.textContent = `(00:${seconds})`;
      
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        timerText.textContent = '';
        resendBtn.disabled = false;
        resendBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'text-on-surface-variant');
        resendBtn.classList.add('text-primary');
      }
    }, 1000);
  });
</script></main></body></html>
