<script>
    function copyId(btn) {
      const icon = btn.querySelector('span');
      const originalIcon = icon.innerText;
      icon.innerText = 'check';
      btn.classList.add('bg-primary-container', 'text-on-primary-container');
      btn.classList.remove('bg-surface-container', 'text-primary');
      
      // Create a small particle effect
      const rect = btn.getBoundingClientRect();
      for(let i=0; i<3; i++) {
        const particle = document.createElement('div');
        particle.className = 'absolute w-1.5 h-1.5 rounded-full bg-primary pointer-events-none';
        particle.style.left = `${rect.left + rect.width/2}px`;
        particle.style.top = `${rect.top + rect.height/2}px`;
        particle.style.transition = 'all 0.5s cubic-bezier(0.2, 1, 0.3, 1)';
        document.body.appendChild(particle);
        
        requestAnimationFrame(() => {
          const angle = (Math.PI * 2 / 3) * i - Math.PI/2;
          const dist = 20;
          particle.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0)`;
          particle.style.opacity = '0';
        });
        
        setTimeout(() => particle.remove(), 500);
      }

      setTimeout(() => {
        icon.innerText = originalIcon;
        btn.classList.remove('bg-primary-container', 'text-on-primary-container');
        btn.classList.add('bg-surface-container', 'text-primary');
      }, 2000);
    }
  </script>
