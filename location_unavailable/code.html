ransition-colors text-on-surface-variant"><span class="material-symbols-outlined text-[18px]">location_on</span><span class="font-label-md text-label-md truncate max-w-[100px]">Downtown</span><span class="material-symbols-outlined text-[18px]">expand_more</span></button></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="pt-16 bg-surface min-h-screen pb-32"><div class="flex flex-col w-full h-[calc(100vh-128px)] justify-center px-margin-mobile relative overflow-hidden">
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const retryBtn = document.getElementById('retry-btn');
      const radarLines = document.querySelectorAll('.radar-line');
      const marker = document.getElementById('location-marker');
      
      retryBtn.addEventListener('click', () => {
        // Add loading state
        retryBtn.innerHTML = '<span class="material-symbols-outlined animate-spin mr-2">refresh</span> Detecting...';
        retryBtn.classList.add('opacity-80', 'pointer-events-none');
        
        // Animate marker
        marker.classList.add('animate-bounce');
        marker.classList.replace('text-error', 'text-primary');
        
        // Animate radar rings
        radarLines.forEach((line, index) => {
           line.style.animation = `ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite ${index * 0.3}s`;
           line.classList.replace('border-error/20', 'border-primary/30');
        });

        // Simulate failure again after 2.5s for demo purposes
        setTimeout(() => {
          retryBtn.innerHTML = 'Retry Detection';
          retryBtn.classList.remove('opacity-80', 'pointer-events-none');
          marker.classList.remove('animate-bounce');
          marker.classList.replace('text-primary', 'text-error');
          
          radarLines.forEach(line => {
             line.style.animation = 'none';
             line.classList.replace('border-primary/30', 'border-error/20');
          });
          
          // Shake error animation
          const container = document.getElementById('error-container');
          container.classList.add('animate-[shake_0.5s_ease-in-out]');
          setTimeout(() => container.classList.remove('animate-[shake_0.5s_ease-in-out]'), 500);
        }, 2500);
      });
    });
  </script>
<style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }
  </style>
<!-- Ambient Background Pattern -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03]" style="background-image: radial-gradient(var(--tw-colors-on-background) 1px, transparent 1px); background-size: 24px 24px;"></div>
<div class="flex flex-col items-center text-center z-10 w-full max-w-sm mx-auto" id="error-container">

<div class="relative w-48 h-48 mb-8 flex items-center justify-center">

<div class="radar-line absolute w-full h-full rounded-full border-2 border-error/20 opacity-0 transition-colors duration-300"></div>
<div class="radar-line absolute w-3/4 h-3/4 rounded-full border-2 border-error/20 opacity-0 transition-colors duration-300"></div>
<div class="radar-line absolute w-1/2 h-1/2 rounded-full border-2 border-error/20 opacity-0 transition-colors duration-300"></div>

</div>
</div>
</div>

        Retry Detection
      </button>
<button class="w-full min-h-[touch-target-min] bg-transparent text-primary font-label-md text-label-md rounded-xl flex items-center justify-center border-2 border-primary/20 hover:border-primary/40 transition-all active:bg-primary/5">

</div>
