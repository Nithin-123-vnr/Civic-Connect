</div>

<option disabled="" selected="" value="">Select State</option>
<option value="state1">Andhra Pradesh</option>
<option value="state2">Telangana</option>
<option value="state3">Karnataka</option>
</select>
</div>
</div>
<div class="flex flex-col gap-1 group">
<label class="font-label-md text-label-md text-on-surface group-focus-within:text-primary" for="district">District <span class="text-error">*</span></label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant pointer-events-none">location_city</span>
<select class="w-full min-h-[48px] pl-10 pr-10 bg-surface border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2343474e%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-[length:24px] bg-[position:right_12px_center] bg-no-repeat disabled:opacity-50 disabled:bg-surface-variant" disabled="" id="district" name="district" required="">
<option disabled="" selected="" value="">Select District</option>
</select>
</div>
</div>
<div class="flex flex-col gap-1 group">

<span class="material-symbols-outlined absolute left-3 text-on-surface-variant pointer-events-none">maps_home_work</span>
<select class="w-full min-h-[48px] pl-10 pr-10 bg-surface border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2343474e%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-[length:24px] bg-[position:right_12px_center] bg-no-repeat disabled:opacity-50 disabled:bg-surface-variant" disabled="" id="mandal" name="mandal" required="">
<option disabled="" selected="" value="">Select Mandal</option>
</select>
</div>
</div>
<div class="flex flex-col gap-1 group">
<label class="font-label-md text-label-md text-on-surface group-focus-within:text-primary" for="village">Village / Local Area <span class="text-error">*</span></label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant pointer-events-none">home_pin</span>
<select class="w-full min-h-[48px] pl-10 pr-10 bg-surface border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2343474e%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-[length:24px] bg-[position:right_12px_center] bg-no-repeat disabled:opacity-50 disabled:bg-surface-variant" disabled="" id="village" name="village" required="">
<option disabled="" selected="" value="">Select Village</option>
</select>
</div>
</div>
</div>
<!-- Agreement & Actions -->
<div class="flex flex-col gap-6 pt-4 mt-2 border-t border-surface-variant">
<label class="flex items-start gap-3 cursor-pointer group min-h-[44px]">
<div class="relative flex items-center justify-center w-6 h-6 mt-0.5">
<input class="peer appearance-none w-6 h-6 border-2 border-outline rounded-sm bg-surface checked:bg-primary checked:border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-colors cursor-pointer" required="" type="checkbox"/>
<span class="material-symbols-outlined absolute text-on-primary text-[18px] opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant select-none">
            I agree to the <a class="text-primary underline decoration-primary/30 hover:decoration-primary transition-colors" href="#">Terms of Service</a> and <a class="text-primary underline decoration-primary/30 hover:decoration-primary transition-colors" href="#">Privacy Policy</a>.
          </span>
</label>
<button class="w-full min-h-[48px] bg-primary text-on-primary font-label-md text-label-md rounded-full shadow-sm hover:shadow-md transition-shadow flex items-center justify-center gap-2 active:scale-[0.98]" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<div class="text-center pb-8">
<p class="font-body-md text-body-md text-on-surface-variant">
            Already have an account? 
            <a class="text-primary font-label-md hover:underline" href="#">Login here</a>
</p>
</div>
</div>
</form>
</div>
<script>
    // Password toggle
    document.querySelector('button[aria-label="Toggle password visibility"]').addEventListener('click', function() {
      const input = document.getElementById('password');
      const icon = document.getElementById('togglePasswordIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility_off';
      }
    });

    // Cascading dropdowns mockup
    const stateSelect = document.getElementById('state');
    const districtSelect = document.getElementById('district');
    const mandalSelect = document.getElementById('mandal');
    const villageSelect = document.getElementById('village');

    stateSelect.addEventListener('change', (e) => {
      if(e.target.value) {
        districtSelect.disabled = false;
        districtSelect.innerHTML = '<option value="" disabled selected>Select District</option><option value="d1">District A</option><option value="d2">District B</option>';
      } else {
        districtSelect.disabled = true;
        mandalSelect.disabled = true;
        villageSelect.disabled = true;
      }
    });

    districtSelect.addEventListener('change', (e) => {
      if(e.target.value) {
        mandalSelect.disabled = false;
        mandalSelect.innerHTML = '<option value="" disabled selected>Select Mandal</option><option value="m1">Mandal X</option><option value="m2">Mandal Y</option>';
      } else {
        mandalSelect.disabled = true;
        villageSelect.disabled = true;
      }
    });

    mandalSelect.addEventListener('change', (e) => {
      if(e.target.value) {
        villageSelect.disabled = false;
        villageSelect.innerHTML = '<option value="" disabled selected>Select Village</option><option value="v1">Village 1</option><option value="v2">Village 2</option>';
      } else {
        villageSelect.disabled = true;
      }
    });
  </script>
