<style>

<script>
        // Simple drag interaction for the bottom sheet
        const sheet = document.getElementById('legend-sheet');
        const handle = document.getElementById('legend-drag-handle');
        let startY = 0;
        let currentY = 0;
        let isDragging = false;

        handle.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            isDragging = true;
            sheet.style.transition = 'none';
        });

        handle.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentY = e.touches[0].clientY;
            const deltaY = currentY - startY;
            
            // Only allow dragging down
            if (deltaY > 0) {
                sheet.style.transform = `translateY(${deltaY}px)`;
            }
        });

        handle.addEventListener('touchend', (e) => {
            isDragging = false;
            sheet.style.transition = 'transform 0.3s ease-in-out';
            const deltaY = currentY - startY;
            
            // If dragged down enough, keep it collapsed (visually pushing it down)
            if (deltaY > 50) {
                sheet.style.transform = 'translateY(70%)';
            } else {
                // Snap back up
                sheet.style.transform = 'translateY(0)';
            }
            startY = 0;
            currentY = 0;
        });
        
        // Hide button functionality
        const hideBtn = sheet.querySelector('.text-primary.cursor-pointer');
        hideBtn.addEventListener('click', () => {
             sheet.style.transform = 'translateY(70%)';
        });
    </script>
