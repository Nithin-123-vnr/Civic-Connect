<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/></head><body class="bg-surface font-body-md text-on-surface"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-margin-mobile flex items-center justify-between gap-4"><div class="flex items-center gap-4"><button class="w-touch-target-min h-touch-target-min flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><div class="flex items-center gap-2"><img alt="CivicConnect logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1VGVRu8vrSgvVkzVpdswbSQLQd5pBe6-bnCOrBxIaJfolrlnPMXvfH2jUDudDjwZwCI7C3rv5U_ccj10vb4KZi2q2u1RGoGZbvh6otN2MjZsXtHYfwnsninrsI8jF1MZQM9vcUUkPHMjx72zYG5mPwK65r_pbG6vbZRFX1DA2HF-0VGLjHA1kK83EZxAXJXYR9gewBezkeX7Tl_8YXvr4KpyiPPwsx-_SAs_WYajAHH2aDfF2q_-_YEZPLT"/><span class="font-headline-md text-headline-md text-on-surface truncate">Profile Completion</span></div></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full pt-16 bg-surface"><div class="flex flex-col w-full h-full min-h-[calc(100vh-64px)] justify-between pb-safe">
<div class="flex flex-col items-center pt-8 px-margin-mobile flex-1">
<!-- Success Animation/Icon -->
<div class="relative w-24 h-24 mb-6 mt-4 flex-shrink-0">
<div class="absolute inset-0 bg-primary/10 rounded-full animate-ping opacity-75" style="animation-duration: 2s;"></div>
<div class="absolute inset-0 bg-primary rounded-full flex items-center justify-center transform hover:scale-105 transition-transform duration-300">
<span class="material-symbols-outlined text-[48px] text-on-primary" style="font-variation-settings: 'FILL' 1;">
                    check_circle
                </span>
</div>
<!-- Confetti particles via JS -->
<div class="absolute inset-0 pointer-events-none" id="confetti-container"></div>
</div>
<!-- Typography -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface text-center mb-3">
            Complaint Submitted!
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-8 max-w-[280px]">
            Your report has been successfully filed with the local authorities.
        </p>
<!-- Summary Card -->
<div class="w-full bg-surface-container rounded-xl p-4 shadow-sm relative overflow-hidden group">
<!-- Decorative accent line -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>
<div class="flex justify-between items-start mb-4 pb-4 border-b border-surface-variant">
<div>
<span class="font-caption text-caption text-on-surface-variant block mb-1">Complaint ID</span>
<div class="flex items-center gap-2">
<span class="font-label-md text-label-md text-on-surface" id="complaint-id">#CC-98241</span>
<button aria-label="Copy ID" class="w-6 h-6 rounded-full bg-surface-variant hover:bg-surface-dim flex items-center justify-center transition-colors active:scale-95" onclick="copyToClipboard()">
<span class="material-symbols-outlined text-[14px] text-on-surface-variant" id="copy-icon">content_copy</span>
</button>
</div>
</div>
<div class="bg-primary-fixed text-on-primary-fixed px-2 py-1 rounded font-caption text-caption font-semibold flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">pending_actions</span>
                    Submitted
                </div>
</div>
<div class="grid grid-cols-2 gap-y-4">
<div>
<span class="font-caption text-caption text-on-surface-variant block mb-1">Category</span>
<span class="font-body-md text-body-md text-on-surface flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">edit_road</span>
                        Roads
                    </span>
</div>
<div>
<span class="font-caption text-caption text-on-surface-variant block mb-1">Date</span>
<span class="font-body-md text-body-md text-on-surface" id="current-date"></span>
</div>
</div>
<!-- Map Placeholder -->
<div class="mt-4 rounded-lg overflow-hidden h-24 w-full relative">
<div class="absolute inset-0 w-full h-full bg-cover bg-center" data-location="City Hall" style="background-image: url('https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
<span class="absolute bottom-2 left-2 font-caption text-caption text-white flex items-center gap-1">
<span class="material-symbols-outlined text-[12px]">location_on</span>
                    Location attached
                 </span>
</div>
</div>
</div>
<!-- Sticky Bottom Actions -->
<div class="p-margin-mobile bg-surface/90 backdrop-blur-md pt-4 mt-8 sticky bottom-0">
<button class="w-full h-touch-target-min bg-primary text-on-primary font-label-md text-label-md rounded-full mb-3 flex items-center justify-center gap-2 hover:bg-on-primary-fixed transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]">timeline</span>
            Track Complaint
        </button>
<button class="w-full h-touch-target-min bg-transparent text-primary font-label-md text-label-md rounded-full border border-primary flex items-center justify-center hover:bg-primary/5 transition-colors active:scale-[0.98]">
            Back to Home
        </button>
</div>
</div>
<script>
    // Set current date
    const dateOptions = { year: 'numeric', month: 'short', day: 'numeric' };
    document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US', dateOptions);

    // Copy to clipboard functionality
    function copyToClipboard() {
        const idText = document.getElementById('complaint-id').textContent;
        const copyIcon = document.getElementById('copy-icon');
        
        navigator.clipboard.writeText(idText).then(() => {
            // Visual feedback
            copyIcon.textContent = 'check';
            copyIcon.classList.add('text-primary');
            
            setTimeout(() => {
                copyIcon.textContent = 'content_copy';
                copyIcon.classList.remove('text-primary');
            }, 2000);
        });
    }

    // Simple JS Confetti effect on load
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('confetti-container');
        const colors = ['#002045', '#1960a3', '#7db6ff', '#f2bc82'];
        
        for (let i = 0; i < 15; i++) {
            createParticle(container, colors);
        }
    });

    function createParticle(container, colors) {
        const particle = document.createElement('div');
        const size = Math.random() * 6 + 4;
        const color = colors[Math.floor(Math.random() * colors.length)];
        
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.backgroundColor = color;
        particle.style.position = 'absolute';
        particle.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        particle.style.top = '50%';
        particle.style.left = '50%';
        
        // Random trajectory
        const angle = Math.random() * Math.PI * 2;
        const velocity = 50 + Math.random() * 100;
        const tx = Math.cos(angle) * velocity;
        const ty = Math.sin(angle) * velocity - 50; // Bias upwards
        
        particle.animate([
            { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
            { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
        ], {
            duration: 800 + Math.random() * 600,
            easing: 'cubic-bezier(0.25, 1, 0.5, 1)',
            fill: 'forwards'
        });
        
        container.appendChild(particle);
        setTimeout(() => particle.remove(), 1500);
    }
</script></main></body></html>
