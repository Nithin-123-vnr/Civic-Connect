<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Interactive Chip Selection
    const chips = document.querySelectorAll('section:first-of-type button');
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        const isSelected = chip.classList.contains('bg-primary-container');
        if (isSelected) {
          chip.classList.remove('bg-primary-container', 'text-on-primary-container');
          chip.classList.add('bg-surface-container', 'text-on-surface');
          const icon = chip.querySelector('.material-symbols-outlined');
          if (icon) icon.remove();
        } else {
          chip.classList.add('bg-primary-container', 'text-on-primary-container');
          chip.classList.remove('bg-surface-container', 'text-on-surface');
          if (!chip.querySelector('.material-symbols-outlined')) {
             chip.insertAdjacentHTML('afterbegin', '<span class="material-symbols-outlined text-[18px]">check</span>');
          }
        }
      });
    });

    // Date Input Formatting
    const setupDateInput = (inputId, displayId) => {
      const input = document.getElementById(inputId);
      const display = document.getElementById(displayId);
      if(input && display) {
        input.addEventListener('change', (e) => {
          const date = new Date(e.target.value);
          if(!isNaN(date)) {
             const formatted = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
             display.querySelector('span:first-child').textContent = formatted;
             display.classList.add('bg-primary-container', 'text-on-primary-container');
             display.classList.remove('bg-surface-container', 'text-on-surface');
          }
        });
      }
    }
    setupDateInput('date-from-input', 'date-from-display');
    setupDateInput('date-to-input', 'date-to-display');

    // Simple Drag to Dismiss Logic (Visual only for demonstration)
    const handle = document.getElementById('drag-handle');
    const sheet = document.getElementById('filter-sheet');
    const backdrop = document.getElementById('filter-backdrop');
    
    let startY = 0;
    
    handle.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
      sheet.style.transition = 'none';
    }, {passive: true});

    handle.addEventListener('touchmove', (e) => {
      const currentY = e.touches[0].clientY;
      const diff = currentY - startY;
      if (diff > 0) {
        sheet.style.transform = `translateY(${diff}px)`;
        backdrop.style.opacity = Math.max(0, 1 - (diff / 300));
      }
    }, {passive: true});

    handle.addEventListener('touchend', (e) => {
       sheet.style.transition = 'transform 0.3s ease-out';
       const currentY = e.changedTouches[0].clientY;
       if (currentY - startY > 100) {
         // Dismiss
         sheet.style.transform = 'translateY(100%)';
         backdrop.style.opacity = '0';
         setTimeout(() => {
           document.getElementById('filter-modal-container').style.display = 'none';
         }, 300);
       } else {
         // Snap back
         sheet.style.transform = 'translateY(0)';
         backdrop.style.opacity = '1';
       }
    });
  });
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary font-bold"><div class="flex justify-between items-center h-16 px-4"><a aria-current="page" class="flex flex-col items-center justify-center min-w-[touch-target-min] text-primary font-bold" data-path="home" href="#"><span class="material-symbols-outlined">home</span><span class="font-caption text-caption">Home</span></a><a class="flex flex-col items-center justify-center min-w-[touch-target-min] text-on-surface-variant" data-path="my-complaints" href="#"><span class="material-symbols-outlined">assignment</span><span class="font-caption text-caption">Complaints</span></a><a class="flex flex-col items-center justify-center min-w-[touch-target-min] text-on-surface-variant" data-path="map" href="#"><span class="material-symbols-outlined">map</span><span class="font-caption text-caption">Map</span></a><a class="flex flex-col items-center justify-center min-w-[touch-target-min] text-on-surface-variant" data-path="notifications" href="#"><span class="material-symbols-outlined">notifications</span><span class="font-caption text-caption">Alerts</span></a><a class="flex flex-col items-center justify-center min-w-[touch-target-min] text-on-surface-variant" data-path="profile" href="#"><span class="material-symbols-outlined">person</span><span class="font-caption text-caption">Profile</span></a></div></nav>
