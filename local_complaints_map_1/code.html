<script>
    document.addEventListener('DOMContentLoaded', () => {
        const markerRoad = document.getElementById('marker-road');
        const previewSheet = document.getElementById('preview-sheet');
        
        let isOpen = false;

        markerRoad.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent map click from closing immediately
            if (!isOpen) {
                previewSheet.classList.remove('translate-y-[150%]');
                previewSheet.classList.add('translate-y-0');
                isOpen = true;
            } else {
                previewSheet.classList.add('translate-y-[150%]');
                previewSheet.classList.remove('translate-y-0');
                isOpen = false;
            }
        });

        // Click anywhere on map to close
        document.addEventListener('click', (e) => {
            if (isOpen && !previewSheet.contains(e.target) && e.target !== markerRoad) {
                previewSheet.classList.add('translate-y-[150%]');
                previewSheet.classList.remove('translate-y-0');
                isOpen = false;
            }
        });
    });
