<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/></head><body class="bg-surface font-body-md text-on-surface"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-margin-mobile flex items-center justify-between gap-4"><div class="flex items-center gap-4"><button class="w-touch-target-min h-touch-target-min flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><div class="flex items-center gap-2"><img alt="CivicConnect logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1VGVRu8vrSgvVkzVpdswbSQLQd5pBe6-bnCOrBxIaJfolrlnPMXvfH2jUDudDjwZwCI7C3rv5U_ccj10vb4KZi2q2u1RGoGZbvh6otN2MjZsXtHYfwnsninrsI8jF1MZQM9vcUUkPHMjx72zYG5mPwK65r_pbG6vbZRFX1DA2HF-0VGLjHA1kK83EZxAXJXYR9gewBezkeX7Tl_8YXvr4KpyiPPwsx-_SAs_WYajAHH2aDfF2q_-_YEZPLT"/><span class="font-headline-md text-headline-md text-on-surface truncate">Profile Completion</span></div></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full pt-16 bg-surface"><div class="flex flex-col w-full h-full min-h-[calc(100vh-64px)] pb-[80px]">
<!-- Progress Indicator -->
<div class="px-margin-mobile pt-unit pb-gutter bg-surface">
<div class="w-full bg-surface-container-highest rounded-full h-2 overflow-hidden">
<div class="bg-primary h-2 rounded-full w-2/5 transition-all duration-300"></div>
</div>
<div class="mt-2 flex justify-between items-center text-caption text-on-surface-variant">
<span>Step 2 of 5</span>
<span>Details</span>
</div>
</div>
<!-- Selected Category Display -->
<div class="px-margin-mobile pb-gutter">
<div class="bg-secondary-container text-on-secondary-container px-4 py-3 rounded-lg flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-secondary text-[20px]" style="font-variation-settings: 'FILL' 1;">add_road</span>
</div>
<div>
<div class="font-caption text-on-secondary-container/80">Category Selected</div>
<div class="font-label-md">Roads & Infrastructure</div>
</div>
<button aria-label="Edit category" class="ml-auto w-touch-target-min h-touch-target-min flex items-center justify-center text-secondary hover:bg-surface/20 rounded-full transition-colors">
<span class="material-symbols-outlined text-[20px]">edit</span>
</button>
</div>
</div>
<!-- Main Content Area -->
<div class="flex-1 px-margin-mobile pb-gutter flex flex-col gap-gutter">
<div>
<h1 class="font-headline-md text-on-surface mb-2">Describe the problem</h1>
<p class="font-body-md text-on-surface-variant">Provide details to help us investigate the issue quickly.</p>
</div>
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Complaint Title Input -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-on-surface" for="complaint-title">Complaint Title <span class="text-error">*</span></label>
<div class="relative group">
<input class="w-full bg-surface h-touch-target-min px-4 font-body-md text-on-surface rounded-lg outline outline-1 outline-outline-variant focus:outline-2 focus:outline-primary transition-all placeholder:text-on-surface-variant/50" id="complaint-title" placeholder="e.g., Large pothole in front of community gate" type="text"/>
</div>
</div>
<!-- Detailed Description Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<label class="font-label-md text-on-surface" for="complaint-description">Detailed Description <span class="text-error">*</span></label>
<span class="font-caption text-on-surface-variant" id="char-count">0/500</span>
</div>
<div class="relative group">
<textarea class="w-full bg-surface p-4 font-body-md text-on-surface rounded-lg outline outline-1 outline-outline-variant focus:outline-2 focus:outline-primary transition-all placeholder:text-on-surface-variant/50 resize-none" id="complaint-description" placeholder="Provide as much detail as possible about the issue..." rows="5"></textarea>
</div>
</div>
<!-- Severity Selection -->
<div class="flex flex-col gap-3">
<label class="font-label-md text-on-surface">Severity (Optional)</label>
<div class="flex gap-3">
<!-- Low -->
<label class="flex-1 relative cursor-pointer group">
<input class="peer sr-only" name="severity" type="radio" value="low"/>
<div class="w-full h-touch-target-min flex flex-col items-center justify-center rounded-lg outline outline-1 outline-outline-variant peer-checked:outline-2 peer-checked:outline-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container text-on-surface-variant transition-all hover:bg-surface-container">
<span class="font-label-md">Low</span>
</div>
</label>
<!-- Medium -->
<label class="flex-1 relative cursor-pointer group">
<input class="peer sr-only" name="severity" type="radio" value="medium"/>
<div class="w-full h-touch-target-min flex flex-col items-center justify-center rounded-lg outline outline-1 outline-outline-variant peer-checked:outline-2 peer-checked:outline-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container text-on-surface-variant transition-all hover:bg-surface-container">
<span class="font-label-md">Medium</span>
</div>
</label>
<!-- High -->
<label class="flex-1 relative cursor-pointer group">
<input class="peer sr-only" name="severity" type="radio" value="high"/>
<div class="w-full h-touch-target-min flex flex-col items-center justify-center rounded-lg outline outline-1 outline-outline-variant peer-checked:outline-2 peer-checked:outline-error peer-checked:bg-error-container peer-checked:text-on-error-container text-on-surface-variant transition-all hover:bg-surface-container">
<span class="font-label-md">High</span>
</div>
</label>
</div>
</div>
</form>
</div>
<!-- Sticky Footer -->
<div class="fixed bottom-0 left-0 right-0 p-margin-mobile bg-surface/90 backdrop-blur-md pb-safe border-t border-surface-container-highest z-40">
<div class="flex gap-4">
<button class="flex-1 h-touch-target-min min-h-[48px] rounded-full outline outline-1 outline-primary text-primary font-label-md flex items-center justify-center hover:bg-primary/5 transition-colors active:scale-[0.98]">
                Back
            </button>
<button class="flex-1 h-touch-target-min min-h-[48px] rounded-full bg-primary text-on-primary font-label-md flex items-center justify-center hover:bg-primary/90 transition-colors shadow-sm active:scale-[0.98]">
                Next Step
            </button>
</div>
</div>
</div>
<script>
    // Character counter for textarea
    const textarea = document.getElementById('complaint-description');
    const charCount = document.getElementById('char-count');
    
    if(textarea && charCount) {
        textarea.addEventListener('input', function() {
            const currentLength = this.value.length;
            charCount.textContent = `${currentLength}/500`;
            
            if (currentLength > 500) {
                this.value = this.value.substring(0, 500);
                charCount.textContent = '500/500';
                charCount.classList.add('text-error');
                textarea.classList.add('outline-error');
            } else {
                charCount.classList.remove('text-error');
                textarea.classList.remove('outline-error');
            }
        });
    }
</script></main></body></html>
