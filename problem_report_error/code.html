      </button>

<script>
    // Micro-interaction for retry button
    document.getElementById('retry-btn').addEventListener('click', function(e) {
      const btn = e.currentTarget;
      const icon = btn.querySelector('.material-symbols-outlined');
      
      // Add spinning class to icon temporarily
      icon.classList.add('animate-spin');
      btn.classList.add('opacity-80');
      btn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">refresh</span> Retrying...';
      
      setTimeout(() => {
        icon.classList.remove('animate-spin');
        btn.classList.remove('opacity-80');
        btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">refresh</span> Retry Submission';
        
        // Jiggle the error icon to indicate it still failed (since this is just a demo)
        const errorContainer = document.getElementById('error-icon-container');
        errorContainer.classList.add('animate-[ping_0.5s_cubic-bezier(0,0,0.2,1)_1]');
        setTimeout(() => {
          errorContainer.classList.remove('animate-[ping_0.5s_cubic-bezier(0,0,0.2,1)_1]');

      }, 1500);
    });
